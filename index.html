<!DOCTYPE html>
<html>
<head>

    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta name="google-signin-client_id" content="371187933871-8aq7bgtfd6mib249u3r3q828t7reuhjf.apps.googleusercontent.com" />
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Satang personal finance app.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=any">


  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Satang">
  <link rel="apple-touch-icon" href="assets/assets/images/logo_app.png?v=20260415">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Satang</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      background: #ffffff;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-loading img {
      width: min(24vw, 132px);
      height: auto;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
    }

    #app-loading span {
      color: #16171a;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
  
  <!-- For download file Start-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/amcharts/3.21.15/plugins/export/libs/FileSaver.js/FileSaver.min.js"></script>
  <!-- For download file End-->

  <!-- Facebook SDK for Web -->
  
<script>
  window.fbAsyncInit = function() {
    FB.init({
      appId      : '1213042099788376',
      cookie     : true,
      xfbml      : true,
      version    : 'v0.1'
    });
      
    FB.AppEvents.logPageView();   
      
  };

  (function(d, s, id){
     var js, fjs = d.getElementsByTagName(s)[0];
     if (d.getElementById(id)) {return;}
     js = d.createElement(s); js.id = id;
     js.src = "https://connect.facebook.net/en_US/sdk.js";
     fjs.parentNode.insertBefore(js, fjs);
   }(document, 'script', 'facebook-jssdk'));
</script>
</head>
<body>
  <div id="app-loading" aria-hidden="true">
    <img
      src="assets/assets/images/logo_app.png?v=20260415"
      alt="Satang logo"
      onerror="this.onerror=null;this.src='icons/Icon-192.png?v=20260414';"
    >
    <span>Satang</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (!loading) {
        return;
      }
      loading.classList.add('is-hidden');
      window.setTimeout(function () {
        loading.remove();
      }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script src="my_js.js"></script>
</body>
</html>
